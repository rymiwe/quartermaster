name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run the test suite
        run: |
          set -eu
          mkdir -p /tmp/emptyhome
          run_suite() {
            env -i PATH=/usr/bin:/bin HOME=/tmp/emptyhome PYTHONDONTWRITEBYTECODE=1 python3 "$1"
          }
          run_suite tests/test_seat_usage.py
          run_suite tests/test_properties.py
          run_suite tests/test_contract.py
          run_suite tests/test_update.py
          run_suite tests/test_install.py
          run_suite tests/test_seat_usage_push.py

      - name: Skip list
        run: |
          printf '%s\n' 'tests/test_seat_meters.py pre-existing failure: FAIL test_phone_5h_track_has_no_text_beside_it [1898]'
