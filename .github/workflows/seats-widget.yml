name: Seats widget

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/seats-widget.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/seats-widget.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships the Android SDK at $ANDROID_HOME.
      # The signing key is a repo secret, never a file in this public repo.
      - name: Write the signing key
        env:
          SEATS_KEYSTORE_B64: ${{ secrets.SEATS_KEYSTORE_B64 }}
        run: |
          if [ -n "$SEATS_KEYSTORE_B64" ]; then
            printf '%s' "$SEATS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/seats.keystore"
            echo "SEATS_KEYSTORE=$RUNNER_TEMP/seats.keystore" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
        env:
          SEATS_KEYSTORE_PASSWORD: ${{ secrets.SEATS_KEYSTORE_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk seats.apk
      - uses: actions/upload-artifact@v4
        with:
          name: seats-apk
          path: android/seats.apk
      # A fixed tag so the phone can always fetch the newest build from one URL.
      - name: Publish seats-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SEATS_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete seats-latest --yes --cleanup-tag || true
          gh release create seats-latest seats.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Seats widget (latest)" \
            --notes "Built from $GITHUB_SHA. Install seats.apk, add the Seats widget, and paste the gist id from \`seat-usage-push --setup\`."
